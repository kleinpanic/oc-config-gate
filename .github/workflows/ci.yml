name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The openclaw devDependency's install scripts set up bundled host
      # plugins and refuse Node < 24; the build and tests need neither.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

      - name: Committed dist/ matches src/
        run: git diff --exit-code -- dist

      - run: npm pack --dry-run
